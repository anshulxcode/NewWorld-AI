[project]
name = "new-world-ai"
version = "0.1.0"
description = "NetWorld-AI Threat Forecasting API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pandas>=2.1.0",
    "numpy",
    "scikit-learn>=1.3.0",
    "plotly>=5.17.0",
    "matplotlib",
    "shap>=0.43.0",
    "scapy>=2.5.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "imbalanced-learn>=0.11.0"
]

[tool.vercel]
entrypoint = "src.api:app"
